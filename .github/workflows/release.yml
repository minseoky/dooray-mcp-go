name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...

  bundle:
    # macOS runners provide lipo, which merges the two macOS architectures into
    # the single binary a .mcpb manifest can point at.
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build the double-click installer bundle
        run: make bundle VERSION="${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist/dooray-mcp-go.mcpb

  release:
    needs: [test, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compile every platform
        run: make release VERSION="${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: dist

      - name: Add the bundle to the checksums
        run: cd dist && sha256sum dooray-mcp-go.mcpb >> SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dooray-mcp-go.mcpb
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Stage binaries into the npm wrapper
        run: make npm-stage VERSION="${GITHUB_REF_NAME}"

      - name: Align the wrapper version with the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: npm

      - name: Publish to npm
        run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
